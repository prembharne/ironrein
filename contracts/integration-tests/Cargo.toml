# Separate crate because near-workspaces runs a Linux/macOS sandbox node.
# Run it through scripts/test-integration.sh (uses Docker on Windows).
[package]
name = "leash-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
