[package]
name = "leash-agent-signer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Leash agent signer: holds the vault's agent key inside an OutLayer TEE and only ever calls agent_spend."

[lib]
path = "src/lib.rs"

[[bin]]
name = "leash-agent-signer"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.1", default-features = false, features = ["alloc"] }
bs58 = "0.5"

# Bindings for the near:rpc host functions. Only the enclave build needs them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.36"

[profile.release]
opt-level = "s"
lto = true
strip = true
